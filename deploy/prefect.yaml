# Prefect 部署清单：cheling 4 个 deployments
# 本机即生产机，pull 步骤直接使用本机工作目录
name: cheling-deployments
prefect-version: 3.x

build: null
push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /home/caocao/cheling

deployments:
  - name: daily-mileage
    entrypoint: tasks/topgps_tasks.py:daily_mileage_flow
    schedules:
      - cron: "0 2 * * *"
        timezone: "Asia/Shanghai"
    work_pool:
      name: cheling-process-pool

  - name: safety-sync-highfreq
    entrypoint: tasks/waybill_tasks.py:safety_sync_flow
    schedules:
      - cron: "*/5 6-9 * * *"
        timezone: "Asia/Shanghai"
    work_pool:
      name: cheling-process-pool

  - name: safety-sync-lowfreq
    entrypoint: tasks/waybill_tasks.py:safety_sync_flow
    schedules:
      - cron: "*/15 0-5,10-23 * * *"
        timezone: "Asia/Shanghai"
    work_pool:
      name: cheling-process-pool

  - name: waybill-sync
    entrypoint: tasks/waybill_tasks.py:waybill_sync_flow
    schedules:
      - cron: "*/15 * * * *"
        timezone: "Asia/Shanghai"
    triggers:
      - type: event
        enabled: true
        match:
          prefect.resource.id: waybill.task
        expect:
          - waybill.approval.approved
    work_pool:
      name: cheling-process-pool