[project]
name = "cheling"
version = "0.1.0"
description = "TOPGPS 与 waybill-sync 合并 Monorepo：统一基础设施 + Prefect Cloud 任务编排"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "motor>=3.4",
    "pymongo>=4.7",
    "tenacity>=8.2",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "ddddocr>=1.4",
    "PyJWT>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
